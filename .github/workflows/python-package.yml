@only_sudo
async def spam_cmd(update: Update, context: ContextTypes.DEFAULT_TYPE):
    if len(context.args) < 2: return await update.message.reply_text("⚠️ Usage: /spam <count> <text>")
    try:
        count = int(context.args[0])
        text = " ".join(context.args[1:])
        chat_id = update.message.chat_id
        spam_active[chat_id] = True
        for _ in range(count):
            if not spam_active.get(chat_id): break
            for bot in bots:
                if not spam_active.get(chat_id): break
                try:
                    await bot.send_message(chat_id, text)
                    await asyncio.sleep(0.1)
                except: continue
        spam_active[chat_id] = False
    except: await update.message.reply_text("⚠️ Invalid count.")

@only_sudo
async def stopspam_cmd(update: Update, context: ContextTypes.DEFAULT_TYPE):
    chat_id = update.message.chat_id
    spam_active[chat_id] = False
    await update.message.reply_text("⏹ Spamming stopped in this chat.")

# --- SUDO ---
@only_owner
async def addsudo(update: Update, context: ContextTypes.DEFAULT_TYPE):
    if update.message.reply_to_message:
        uid = update.message.reply_to_message.from_user.id
        SUDO_USERS.add(uid); save_sudo()
        await update.message.reply_text(f"✅ {uid} added as sudo.")

@only_owner
async def delsudo(update: Update, context: ContextTypes.DEFAULT_TYPE):
    if update.message.reply_to_message:
        uid = update.message.reply_to_message.from_user.id
        if uid in SUDO_USERS:
            SUDO_USERS.remove(uid); save_sudo()
            await update.message.reply_text(f"🗑 {uid} removed from sudo.")

@only_sudo
async def listsudo(update: Update, context: ContextTypes.DEFAULT_TYPE):
    await update.message.reply_text("👑 SUDO USERS:\n" + "\n".join(map(str, SUDO_USERS)))

