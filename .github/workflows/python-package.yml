# ---------------------------
# DECORATORS
# ---------------------------
def only_sudo(func):
    async def wrapper(update: Update, context: ContextTypes.DEFAULT_TYPE):
        uid = update.effective_user.id
        if uid not in SUDO_USERS:
            return await update.message.reply_text("आर्यन  𝐾𝐴 𝐿𝑈𝑁𝐷𝐶𝐻𝑂𝑂𝑆 𝑅𝑁𝐷𝐼𝐾🧃🦋😈🎀")
        return await func(update, context)
    return wrapper

def only_owner(func):
    async def wrapper(update: Update, context: ContextTypes.DEFAULT_TYPE):
        uid = update.effective_user.id
        if uid != OWNER_ID:
            return await update.message.reply_text("❌ Only Owner can do this.")
        return await func(update, context)
    return wrapper

# ---------------------------
# LOOP FUNCTION
# ---------------------------
async def bot_loop(bot, chat_id, base, mode):
    i = 0
    while True:
        try:
            if mode == "raid":
                text = f"{base} {RAID_TEXTS[i % len(RAID_TEXTS)]}"
            elif mode == "heart":
                text = f"{base} {HEART_EMOJIS[i % len(HEART_EMOJIS)]}"
            elif mode == "animal":
                text = f"{base} {ANIMAL_EMOJIS[i % len(ANIMAL_EMOJIS)]}"
            elif mode == "cute":
                text = f"{base} {CUTE_EMOJIS[i % len(CUTE_EMOJIS)]}"
            elif mode == "choco":
                text = f"{base} {CHOCO_EMOJIS[i % len(CHOCO_EMOJIS)]}"
            elif mode == "gcloop":
                text = f"{base} {GCLOOP_TEXTS[i % len(GCLOOP_TEXTS)]}"
            elif mode == "gcloop2":
                text = f"{base} {GCLOOP2_TEXTS[i % len(GCLOOP2_TEXTS)]}"
            elif mode == "gcloop3":
                text = f"{base} {GCLOOP3_TEXTS[i % len(GCLOOP3_TEXTS)]}"
            elif mode == "gcloop4":
                text = f"{base} {GCLOOP4_TEXTS[i % len(GCLOOP4_TEXTS)]}"
            elif mode == "gcloop5":
                text = f"{base} {GCLOOP5_TEXTS[i % len(GCLOOP5_TEXTS)]}"
            elif mode == "nctmkcwali":
                text = f"{base} {NCTMKCWALI_TEXTS[i % len(NCTMKCWALI_TEXTS)]}"
            else:
                text = f"{base} {NCEMO_EMOJIS[i % len(NCEMO_EMOJIS)]}"
            await bot.set_chat_title(chat_id, text)
            i += 1
            await asyncio.sleep(delay)
        except Exception as e:
            print(f"[WARN] Bot error in chat {chat_id}: {e}")
            await asyncio.sleep(2)

