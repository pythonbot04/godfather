# BUILD APP & RUN
# ---------------------------
def build_app(token):
    app = Application.builder().token(token).build()
    app.add_handler(CommandHandler("start", start_cmd))
    app.add_handler(CommandHandler("help", help_cmd))
    app.add_handler(CommandHandler("ping", ping_cmd))
    app.add_handler(CommandHandler("myid", myid))
    app.add_handler(CommandHandler("gcnc", gcnc))
    app.add_handler(CommandHandler("ncemo", ncemo))
    app.add_handler(CommandHandler("ncheart", ncheart))
    app.add_handler(CommandHandler("ncanimal", ncanimal))
    app.add_handler(CommandHandler("stopgcnc", stopgcnc))
    app.add_handler(CommandHandler("stopall", stopall))
    app.add_handler(CommandHandler("delay", delay_cmd))
    app.add_handler(CommandHandler("status", status_cmd))
    app.add_handler(CommandHandler("addsudo", addsudo))
    app.add_handler(CommandHandler("delsudo", delsudo))
    app.add_handler(CommandHandler("listsudo", listsudo))
    app.add_handler(CommandHandler("targetslide", targetslide))
    app.add_handler(CommandHandler("stopslide", stopslide))
    app.add_handler(CommandHandler("slidespam", slidespam))
    app.add_handler(CommandHandler("stopslidespam", stopslidespam))
    app.add_handler(CommandHandler("spam", spam_cmd))
    app.add_handler(CommandHandler("stopspam", stopspam_cmd))
    app.add_handler(CommandHandler("nccute", nccute))
    app.add_handler(CommandHandler("ncchoco", ncchoco))
    app.add_handler(CommandHandler("gcloop", gcloop))
    app.add_handler(CommandHandler("gcloop2", gcloop2))
    app.add_handler(CommandHandler("gcloop3", gcloop3))
    app.add_handler(CommandHandler("gcloop4", gcloop4))
    app.add_handler(CommandHandler("gcloop5", gcloop5))
    app.add_handler(CommandHandler("nctmkcwali", nctmkcwali))
    app.add_handler(CommandHandler("swipe", swipe))
    app.add_handler(CommandHandler("stopswipe", stopswipe))
    app.add_handler(CommandHandler("swipe2", swipe2))
    app.add_handler(CommandHandler("stopswipe2", stopswipe2))
    app.add_handler(MessageHandler(filters.TEXT & ~filters.COMMAND, auto_replies))
    return app

async def run_all_bots():
    global apps, bots
    for token in TOKENS:
        if token.strip():
            try:
                app = build_app(token)
                apps.append(app); bots.append(app.bot)
                await asyncio.sleep(0.5)
            except Exception as e:
                print("Failed building app:", e)
                await asyncio.sleep(1)

    for app in apps:
        try:
            await app.initialize(); await app.start(); await app.updater.start_polling()
            await asyncio.sleep(0.3)
        except Exception as e:
            print("Failed starting app:", e)
            await asyncio.sleep(2)

    print("🚀 Mafia Bot is running (all bots started).")
    while True: await asyncio.sleep(3600)

if __name__ == "__main__":
    asyncio.run(run_all_bots())
